<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IKEA Header — proportional</title>
  <style>
    :root {
      --base-w: 1996;
      --base-h: 144;
      --header-scale: 1;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: #fff;
    }

    body {
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", Pretendard, Arial, sans-serif;
      color: #111;
    }

    /*
      핵심:
      원본 스크린샷의 1996×144 비율을 그대로 유지한다.
      브라우저가 좁아지면 좌우/상하를 따로 줄이지 않고
      전체 헤더를 동일 배율로 축소한다.
    */
    .header-viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 1996 / 144;
      overflow: visible;
      background: #fff;
    }

    .header-stage {
      position: absolute;
      inset: 0 auto auto 0;
      width: 1996px;
      height: 144px;
      transform-origin: 0 0;
      transform: scale(var(--header-scale));
      overflow: visible;
      background: #fff;
    }

    .topbar {
      position: absolute;
      left: 0;
      top: 0;
      width: 1996px;
      height: 46px;
      background: #000;
      color: #fff;
    }

    .mainbar {
      position: absolute;
      left: 0;
      top: 46px;
      width: 1996px;
      height: 98px;
      background: #fff;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .top-item {
      position: absolute;
      top: 0;
      height: 46px;
      display: flex;
      align-items: center;
      white-space: nowrap;
      font-size: 16px;
      font-weight: 400;
      line-height: 1;
    }

    .top-left {
      left: 64px;
      gap: 10px;
    }

    .top-center {
      left: 50%;
      transform: translateX(-50%);
    }

    .top-right-post {
      left: 1643px;
      gap: 9px;
    }

    .top-right-store {
      left: 1828px;
      gap: 9px;
    }

    .top-icon {
      display: block;
      object-fit: contain;
      flex: none;
    }

    .globe { width: 28px; height: 27px; }
    .truck { width: 32px; height: 28px; }
    .store { width: 30px; height: 28px; }

    .logo {
      position: absolute;
      left: 64px;
      top: 30px;
      width: 113px;
      height: 48px;
      object-fit: contain;
    }

    .nav {
      position: absolute;
      left: 237px;
      top: 0;
      height: 98px;
      display: flex;
      align-items: center;
      gap: 36px;
      white-space: nowrap;
    }

    .nav a {
      font-size: 16px;
      font-weight: 400;
      line-height: 1;
    }

    .searchbox {
      position: absolute;
      left: 893px;
      top: 28px;
      width: 666px;
      height: 53px;
      border-radius: 999px;
      background: #f5f5f5;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 17px;
      top: 13px;
      width: 26px;
      height: 27px;
      object-fit: contain;
    }

    .search-input {
      position: absolute;
      left: 52px;
      top: 0;
      width: 555px;
      height: 53px;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      font: inherit;
      font-size: 20px;
      font-weight: 400;
      color: #111;
    }

    .search-input::placeholder {
      color: #111;
      opacity: 1;
    }

    .camera {
      position: absolute;
      right: 17px;
      top: 13px;
      width: 29px;
      height: 27px;
      object-fit: contain;
    }

    .actions {
      position: absolute;
      inset: 0 0 0 auto;
      height: 98px;
    }

    .login {
      position: absolute;
      left: -324px;
      top: 0;
      height: 98px;
      display: flex;
      align-items: center;
      gap: 9px;
      white-space: nowrap;
      font-size: 16px;
    }

    .user-icon {
      width: 27px;
      height: 27px;
      object-fit: contain;
    }

    .heart-btn,
    .bag-btn {
      position: absolute;
      top: 35px;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
    }

    .heart-btn { left: -146px; }
    .bag-btn { left: -94px; }

    .heart {
      width: 29px;
      height: 29px;
      object-fit: contain;
    }

    .bag {
      width: 31px;
      height: 30px;
      object-fit: contain;
    }

    button, input { font: inherit; }
  </style>
</head>

<body>
<style>
  /* Responsive header used by generated landing pages. The older fixed-stage
     header below is kept only as a source backup and is not rendered. */
  .header-viewport { display: none !important; }
  .ikea-live-header, .ikea-live-header * { box-sizing: border-box; }
  .ikea-live-header { width: 100%; color: #111; background: #fff; font-family: "IKEA Sans", "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif; }
  .ikea-live-header a { color: inherit; text-decoration: none; }
  .ikea-live-header button, .ikea-live-header input { font: inherit; }
  .ikea-live-header button { border: 0; background: transparent; cursor: pointer; }
  .ikea-live-header__inner { width: min(100% - 64px, 1680px); margin-inline: auto; }
  .ikea-live-header__utility { height: 50px; color: #fff; background: #111; font-size: 14px; font-weight: 500; }
  .ikea-live-header__utility-inner { display: grid; height: 100%; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 20px; }
  .ikea-live-header__link, .ikea-live-header__utility-actions, .ikea-live-header__utility-actions a { display: flex; align-items: center; gap: 8px; }
  .ikea-live-header__utility-actions { justify-self: end; gap: 30px; }
  .ikea-live-header__notice { white-space: nowrap; }
  .ikea-live-header__main { border-bottom: 1px solid #e5e5e5; }
  .ikea-live-header__main-inner { display: grid; min-height: 78px; grid-template-columns: 100px auto minmax(300px, 1fr) auto; align-items: center; gap: 46px; }
  .ikea-live-header__logo { display: block; width: 100px; height: 40px; }
  .ikea-live-header__logo svg { display: block; width: 100%; height: 100%; }
  .ikea-live-header__nav { display: flex; align-items: center; gap: 30px; white-space: nowrap; }
  .ikea-live-header__nav a { font-size: 15px; font-weight: 400; }
  .ikea-live-header__nav a:hover { text-decoration: underline; text-underline-offset: 5px; }
  .ikea-live-header__search { display: flex; min-width: 0; height: 50px; align-items: center; gap: 12px; padding: 0 18px; border-radius: 25px; background: #f5f5f5; }
  .ikea-live-header__search input { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; color: #111; font-size: 15px; font-weight: 400; }
  .ikea-live-header__search input::placeholder { color: #484848; opacity: 1; }
  .ikea-live-header__icon { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; }
  .ikea-live-header__icon--small { width: 18px; height: 18px; }
  .ikea-live-header__account { display: flex; align-items: center; gap: 22px; }
  .ikea-live-header__account-link { display: flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 15px; font-weight: 400; }
  .ikea-live-header__icon-button, .ikea-live-header__menu { display: grid; padding: 2px; place-items: center; }
  .ikea-live-header__menu { display: none; }
  @media (min-width: 881px) and (max-width: 1180px) {
    .ikea-live-header__inner { width: calc(100% - 48px); }
    .ikea-live-header__utility { height: 32px; font-size: 11px; }
    .ikea-live-header__utility-actions { gap: 20px; }
    .ikea-live-header__main-inner { min-height: 64px; grid-template-columns: 80px auto minmax(220px, 1fr) auto; gap: 20px; }
    .ikea-live-header__logo { width: 80px; height: 32px; }
    .ikea-live-header__nav { gap: 16px; }
    .ikea-live-header__nav a { font-size: 12px; }
    .ikea-live-header__search { height: 42px; padding-inline: 14px; }
    .ikea-live-header__search input { font-size: 13px; }
    .ikea-live-header__icon { width: 20px; height: 20px; }
    .ikea-live-header__account { gap: 14px; }
    .ikea-live-header__account-link span { display: none; }
  }
  @media (max-width: 880px) {
    .ikea-live-header__inner { width: min(100% - 32px, 1680px); }
    .ikea-live-header__utility-inner { grid-template-columns: 1fr auto; }
    .ikea-live-header__notice, .ikea-live-header__utility-actions a:last-child { display: none; }
    .ikea-live-header__utility-actions { gap: 16px; }
    .ikea-live-header__main-inner { min-height: 68px; grid-template-columns: auto auto 1fr auto; gap: 16px; }
    .ikea-live-header__menu { display: grid; }
    .ikea-live-header__logo { width: 75px; height: 30px; }
    .ikea-live-header__nav, .ikea-live-header__account-link { display: none; }
    .ikea-live-header__account { gap: 12px; }
    .ikea-live-header__main-inner > .ikea-live-header__search { grid-column: 1 / -1; grid-row: 2; margin-bottom: 16px; }
  }
</style>
