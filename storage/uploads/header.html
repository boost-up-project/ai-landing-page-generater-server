<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IKEA Header — proportional</title>
  <style>
    :root {
      --base-w: 1996;
      --base-h: 144;
      --header-scale: 1;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: #fff;
    }

    body {
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", Pretendard, Arial, sans-serif;
      color: #111;
    }

    /*
      핵심:
      원본 스크린샷의 1996×144 비율을 그대로 유지한다.
      브라우저가 좁아지면 좌우/상하를 따로 줄이지 않고
      전체 헤더를 동일 배율로 축소한다.
    */
    .header-viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 1996 / 144;
      overflow: visible;
      background: #fff;
    }

    .header-stage {
      position: absolute;
      inset: 0 auto auto 0;
      width: 1996px;
      height: 144px;
      transform-origin: 0 0;
      transform: scale(var(--header-scale));
      overflow: visible;
      background: #fff;
    }

    .topbar {
      position: absolute;
      left: 0;
      top: 0;
      width: 1996px;
      height: 46px;
      background: #000;
      color: #fff;
    }

    .mainbar {
      position: absolute;
      left: 0;
      top: 46px;
      width: 1996px;
      height: 98px;
      background: #fff;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .top-item {
      position: absolute;
      top: 0;
      height: 46px;
      display: flex;
      align-items: center;
      white-space: nowrap;
      font-size: 16px;
      font-weight: 400;
      line-height: 1;
    }

    .top-left {
      left: 64px;
      gap: 10px;
    }

    .top-center {
      left: 50%;
      transform: translateX(-50%);
    }

    .top-right-post {
      left: 1643px;
      gap: 9px;
    }

    .top-right-store {
      left: 1828px;
      gap: 9px;
    }

    .top-icon {
      display: block;
      object-fit: contain;
      flex: none;
    }

    .globe { width: 28px; height: 27px; }
    .truck { width: 32px; height: 28px; }
    .store { width: 30px; height: 28px; }

    .logo {
      position: absolute;
      left: 64px;
      top: 30px;
      width: 113px;
      height: 48px;
      object-fit: contain;
    }

    .nav {
      position: absolute;
      left: 237px;
      top: 0;
      height: 98px;
      display: flex;
      align-items: center;
      gap: 36px;
      white-space: nowrap;
    }

    .nav a {
      font-size: 16px;
      font-weight: 400;
      line-height: 1;
    }

    .searchbox {
      position: absolute;
      left: 893px;
      top: 28px;
      width: 666px;
      height: 53px;
      border-radius: 999px;
      background: #f5f5f5;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 17px;
      top: 13px;
      width: 26px;
      height: 27px;
      object-fit: contain;
    }

    .search-input {
      position: absolute;
      left: 52px;
      top: 0;
      width: 555px;
      height: 53px;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      font: inherit;
      font-size: 20px;
      font-weight: 400;
      color: #111;
    }

    .search-input::placeholder {
      color: #111;
      opacity: 1;
    }

    .camera {
      position: absolute;
      right: 17px;
      top: 13px;
      width: 29px;
      height: 27px;
      object-fit: contain;
    }

    .actions {
      position: absolute;
      inset: 0 0 0 auto;
      height: 98px;
    }

    .login {
      position: absolute;
      left: -324px;
      top: 0;
      height: 98px;
      display: flex;
      align-items: center;
      gap: 9px;
      white-space: nowrap;
      font-size: 16px;
    }

    .user-icon {
      width: 27px;
      height: 27px;
      object-fit: contain;
    }

    .heart-btn,
    .bag-btn {
      position: absolute;
      top: 35px;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
    }

    .heart-btn { left: -146px; }
    .bag-btn { left: -94px; }

    .heart {
      width: 29px;
      height: 29px;
      object-fit: contain;
    }

    .bag {
      width: 31px;
      height: 30px;
      object-fit: contain;
    }

    button, input { font: inherit; }
  </style>
</head>

<script>
  (function () {
    const BASE_W = 1996;

    function fitHeader() {
      // 브라우저 폭에 맞춰 x/y를 '같은 비율'로 축소한다.
      // min-width를 쓰지 않기 때문에 어느 폭에서도 좌우가 잘리지 않는다.
      const scale = window.innerWidth / BASE_W;
      document.documentElement.style.setProperty("--header-scale", scale);
    }

    fitHeader();
    window.addEventListener("resize", fitHeader, { passive: true });
  })();
</script>
